<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>加载中 · 芙宁娜</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0f2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
            color: white;
            text-align: center;
        }

        .intro-container {
            max-width: 600px;
            padding: 20px;
        }

        .gif-wrapper {
            margin-bottom: 20px;
        }

        .gif-wrapper img {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.6);
        }

        .welcome-text {
            font-size: 1.6em;
            color: #00eeff;
            text-shadow: 0 0 10px rgba(0, 238, 255, 0.8);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="intro-container">
    <!-- 替换为你自己的 GIF 路径 -->
    <div class="gif-wrapper">
        <img src="images/furina.gif" alt="芙宁娜登场动画">
    </div>
    <div class="welcome-text">欢迎来到芙宁娜的世界</div>
</div>

<script>
    // 3秒后自动跳转到 about.html
    setTimeout(() => {
        window.location.href = 'about.html';
    }, 3000); // 3000 毫秒 = 3 秒
</script>

</body>
</html>
