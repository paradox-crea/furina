<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芙宁娜 · 人物档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c1445, #1a237e);
            color: #e3f2fd;
            min-height: 100vh;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 14, 53, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 191, 255, 0.3);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        nav a {
            color: #b3e5fc;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: rgba(0, 191, 255, 0.3);
            color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            gap: 0;
            padding-top: 70px;
        }

        /* 左侧：立绘 */
        .portrait {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .portrait::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 191, 255, 0.1) 0%, transparent 70%);
        }

        .portrait img {
            max-width: 100%;
            max-height: 80vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #4fc3f7;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.6), 0 0 60px rgba(0, 150, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        /* 右侧：竖排文字 */
        .bio {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            background: rgba(13, 19, 66, 0.85);
            backdrop-filter: blur(8px);
            border-left: 1px solid rgba(79, 195, 247, 0.3);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            line-height: 2.5;
            font-size: 1.6vw;
            letter-spacing: 0.15em;
            text-align: center;
        }

        .bio-content {
            position: relative;
        }

        .bio h2 {
            color: #00eeff;
            font-size: 2.2vw;
            margin-bottom: 1.5em;
            text-shadow: 0 0 15px rgba(0, 238, 255, 0.7);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 15px rgba(0, 238, 255, 0.5); }
            50% { text-shadow: 0 0 25px rgba(0, 238, 255, 0.8); }
        }

        .bio p {
            margin: 0;
            font-weight: 300;
            color: #b3e5fc;
        }

        /* 属性信息 */
        .stats {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(13, 19, 66, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(0, 191, 255, 0.3);
            writing-mode: horizontal-tb;
            text-orientation: unset;
            font-size: 0.9em;
        }

        .stats h3 {
            color: #00e5ff;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 10px;
        }

        .stats-label {
            color: #81d4fa;
        }

        .stats-value {
            color: #e1f5fe;
            font-weight: bold;
        }

        /* 底部导航 */
        .nav-section {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .btn {
            display: inline-block;
            margin: 0 15px;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
            background: rgba(0, 100, 180, 0.6);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover {
            background: rgba(0, 191, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
        }

        .btn:hover::after {
            width: 200px;
            height: 200px;
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .portrait {
                padding: 20px;
            }

            .portrait img {
                max-height: 50vh;
            }

            .bio {
                writing-mode: horizontal-tb;
                text-orientation: unset;
                font-size: 1.1em;
                text-align: center;
                line-height: 1.8;
                padding: 25px 20px;
                border-left: none;
                border-top: 1px solid rgba(79, 195, 247, 0.3);
            }

            .bio h2 {
                font-size: 1.6em;
                margin-bottom: 15px;
            }

            .stats {
                position: static;
                margin-top: 20px;
            }

            nav ul {
                gap: 15px;
            }

            nav a {
                font-size: 0.9em;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="intro.html">档案馆</a></li>
            <li><a href="character.html">人物档案</a></li>
            <li><a href="goddess-vs-human.html">神性解析</a></li>
            <li><a href="trials.html">审判记录</a></li>
            <li><a href="operas.html">歌剧艺术</a></li>
            <li><a href="quotes.html">经典语录</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- 左侧：立绘 -->
        <div class="portrait">
            <img src="images/furinapart.png" alt="芙宁娜立绘">
        </div>

        <!-- 右侧：竖排人物介绍 -->
        <div class="bio">
            <div class="bio-content">
                <h2>芙宁娜·德·枫丹</h2>
                <p>米哈游出品的游戏《原神》及其衍生作品中的角色，魔神名芙卡洛斯，"尘世七执政"中的末任水神，众水、众方、众民与众律法的女王，曾经统治着水之国枫丹，深受民众喜爱。她既是舞台上光芒四射的歌剧明星，也是法庭上威严公正的审判者。五百年的岁月里，她以完美的演技扮演着神明的角色，直到预言落幕，才终于找到了真正的自己。</p>
                
                <!-- 属性信息 -->
                <div class="stats">
                    <h3>角色信息</h3>
                    <div class="stats-row">
                        <span class="stats-label">称号</span>
                        <span class="stats-value">水之主宰</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">神之心</span>
                        <span class="stats-value">水</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">武器</span>
                        <span class="stats-value">法器</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">所属</span>
                        <span class="stats-value">枫丹</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 导航按钮 -->
    <div class="nav-section">
        <a href="intro.html" class="btn">← 返回档案馆</a>
        <a href="goddess-vs-human.html" class="btn">深入了解神性 →</a>
    </div>
</body>
</html>
